name: poll-fr24
on:
  schedule:
    # Minutos raros para evitar el throttling de GitHub Actions en horas pico
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}

concurrency:
  group: poll-fr24
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poll FR24 and forward to Netlify
        env:
          NETLIFY_BASE:  ${{ secrets.NETLIFY_BASE }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          UA='Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Safari/605.1.15'
          echo "::group::Fetch active-idents"
          combos_json=$(curl -fsSL --retry 3 --retry-delay 2 "$NETLIFY_BASE/api/active-idents" | jq -c '.combos // []')
          echo "combos: $combos_json"
          len=$(echo "$combos_json" | jq 'length')
          echo "active combos: $len"
          echo "::endgroup::"
          if [ "$len" -eq 0 ]; then
            echo "No active subscriptions — nothing to poll."
            exit 0
          fi
          ok=0
          fail=0
          for i in $(seq 0 $((len-1))); do
            ident=$(echo "$combos_json" | jq -r ".[$i].ident")
            ik=$(echo "$combos_json" | jq -r ".[$i].instance_key // \"\"")
            if [ -z "$ident" ] || [ "$ident" = "null" ]; then continue; fi
            echo "::group::Poll $ident (instance=$ik)"
            sleep $((RANDOM % 3 + 1))
            list=$(curl -fsSL --max-time 8 -A "$UA" \
              -H 'Origin: https://www.flightradar24.com' \
              -H 'Referer: https://www.flightradar24.com/' \
              "https://api.flightradar24.com/common/v1/flight/list.json?query=${ident}&fetchBy=flight&page=1&limit=10" 2>/dev/null || echo '{}')
            # Buscar la primera entrada que tenga flight_id (no None)
            fid=$(echo "$list" | jq -r '[.result.response.data[]? | select(.identification.id != null) | .identification.id] | first // ""')
            click='{}'
            if [ -n "$fid" ] && [ "$fid" != "null" ] && [ "$fid" != "" ]; then
              echo "found flight_id: $fid"
              click=$(curl -fsSL --max-time 8 -A "$UA" \
                -H 'Origin: https://www.flightradar24.com' \
                -H 'Referer: https://www.flightradar24.com/' \
                "https://data-live.flightradar24.com/clickhandler/?flight=${fid}&version=1.5" 2>/dev/null || echo '{}')
            else
              echo "no flight_id in FR24 list — ingesting schedule data only"
            fi
            body=$(jq -nc --arg id "$ident" --arg ik "$ik" --argjson list "$list" --argjson click "$click" \
              '{ident:$id, instance_key:(if $ik=="" then null else $ik end), list:$list, click:$click}')
            sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$INGEST_SECRET" -hex | awk '{print $2}')
            http_code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
              -X POST "$NETLIFY_BASE/api/ingest-fr24" \
              -H "Content-Type: application/json" \
              -H "X-Ingest-Sig: $sig" \
              --data "$body" || echo "000")
            if [ "$http_code" = "200" ]; then
              ok=$((ok+1))
              echo "ingest OK: $(cat /tmp/resp.json)"
            else
              fail=$((fail+1))
              echo "ingest FAILED (HTTP $http_code): $(cat /tmp/resp.json 2>/dev/null || echo 'no body')"
            fi
            echo "::endgroup::"
          done
          echo "=== Summary: $ok OK, $fail failed (of $len combos) ==="
